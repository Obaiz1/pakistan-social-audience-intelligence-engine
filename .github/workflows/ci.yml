name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (runtime + dev; no torch — embeddings are precomputed)
        run: pip install -e ".[dev]"
      - name: Ruff
        run: python -m ruff check backend pipelines
      - name: Compile
        run: python -m compileall -q backend
      - name: Verify committed dataset bundles (SHA-256 manifests)
        run: |
          python - <<'EOF'
          import sys; sys.path.insert(0, "backend")
          from pathlib import Path
          from audienceiq.storage.db import verify_manifest
          bad = {d.name: verify_manifest(d) for d in Path("data/datasets").iterdir() if (d / "dataset.json").exists()}
          print(bad)
          assert not any(bad.values()), bad
          EOF
      - name: Pytest
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -e ".[dev]"
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Start API + web, run the ten user journeys and the axe-core screen sweep
        run: |
          uvicorn audienceiq.api.app:app --app-dir backend --port 8000 &
          (cd frontend && npm run build && npx next start --hostname 127.0.0.1 --port 3000) &
          for i in $(seq 1 90); do curl -sf http://127.0.0.1:8000/api/v1/health >/dev/null && curl -sf http://127.0.0.1:3000 >/dev/null && break; sleep 2; done
          APP_URL=http://127.0.0.1:3000 node frontend/e2e/journey.mjs
          APP_URL=http://127.0.0.1:3000 QA_TAG=ci node frontend/e2e/screens.mjs
