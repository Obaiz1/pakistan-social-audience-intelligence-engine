[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "audienceiq-pk"
version = "1.0.0"
description = "Pakistan Social Audience & Campaign Intelligence Engine (Clustering Based) — University Project 3"
readme = "README.md"
requires-python = ">=3.12,<3.13"
# Runtime set deployed to Vercel (mirrored, pinned, in frontend/requirements.txt).
dependencies = [
    "fastapi==0.121.3",
    "pydantic==2.12.5",
    "numpy==2.3.5",
    "pandas==2.3.3",
    "scikit-learn==1.7.2",
    "scipy==1.16.3",
    "openpyxl==3.1.5",
    "fpdf2==2.8.9",
]

[project.optional-dependencies]
# Local development / tests.
dev = ["pytest==8.4.2", "httpx==0.28.1", "ruff==0.14.14", "uvicorn==0.38.0", "requests==2.32.5", "python-dotenv==1.2.4"]
# Offline pipelines only (never deployed): multilingual sentence embeddings.
ml = ["sentence-transformers>=5,<6", "torch>=2.5"]

[tool.setuptools.packages.find]
where = ["backend"]
include = ["audienceiq*"]

[tool.setuptools.package-data]
audienceiq = ["storage/schema.sql"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend", "."]
addopts = "-p no:cacheprovider"
markers = ["slow: builds full datasets (deselect with -m 'not slow')"]

[tool.ruff]
target-version = "py312"
line-length = 110
extend-exclude = ["frontend/.backend", "frontend/node_modules", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["audienceiq"]
